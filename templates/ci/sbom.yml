# nyann SBOM workflow — Software Bill of Materials
# Generated by bin/gen-ci.sh when the profile enables security.sbom.
# Edit freely outside the marker comments; regeneration replaces only
# the region between # nyann:sbom:start / # nyann:sbom:end.

name: SBOM

on:
  push:
    branches: [${BASE_BRANCHES}]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned deliberately (unlike the tag-pinned CI templates):
      # this workflow IS a security-posture artifact, so its own supply
      # chain stays pinned. Pair with a dependabot github-actions entry
      # (bin/gen-dependency-updater.sh) to keep the pins fresh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SBOM (${SBOM_FORMAT})
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: ${SBOM_ACTION_FORMAT}
          output-file: ${SBOM_FILE}
          artifact-name: ${SBOM_FILE}
